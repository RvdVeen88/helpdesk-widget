<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Helpdesk</title>

  <!-- Bot Framework Web Chat -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <!-- Tabler iconen (voor het verversicoon) -->
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --dc-blue:           #1E4189;
      --dc-bubble-bot:     #F1F4F9;
      --dc-bubble-user:    #1E4189;
      --dc-bubble-user-tx: #FFFFFF;
      --dc-bg:             #FFFFFF;
      --dc-text:           #1F2430;
      --dc-text-soft:      #5A6072;
      --dc-border:         #E8EDF3;
      --dc-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }
    html, body { margin:0; padding:0; height:100%; background:var(--dc-bg); font-family:var(--dc-font); color:var(--dc-text); }
    #app { display:flex; flex-direction:column; height:100vh; min-height:100%; }
    .dc-header { display:flex; align-items:center; gap:10px; margin:10px; padding:10px 16px; background:#FFFFFF; border:1.5px solid var(--dc-blue); border-radius:12px; flex:0 0 auto; }
    .dc-header .dc-dot { width:9px; height:9px; border-radius:50%; background:#2ECC71; flex:0 0 auto; animation:breathe 2s ease-in-out infinite; }
    .dc-header h1 { font-size:15px; font-weight:600; margin:0; color:var(--dc-blue); }
    .dc-header .dc-refresh { margin-left:auto; color:#9AA6B6; font-size:18px; cursor:pointer; }
    @keyframes breathe {
      0%,100% { box-shadow:0 0 0 0 rgba(46,204,113,.55); opacity:1; }
      50%      { box-shadow:0 0 0 5px rgba(46,204,113,0); opacity:.65; }
    }
    #webchat { flex:1 1 auto; min-height:0; overflow:hidden; }
    .dc-status { flex:1 1 auto; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:24px; text-align:center; color:var(--dc-text-soft); }
    .dc-status .spinner { width:28px; height:28px; border:3px solid var(--dc-border); border-top-color:var(--dc-blue); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .dc-status .hint { font-size:13px; max-width:360px; line-height:1.5; }
    @media (prefers-reduced-motion: reduce) { .dc-status .spinner, .dc-header .dc-dot { animation:none; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="dc-header">
      <span class="dc-dot" aria-hidden="true"></span>
      <h1>AI Helpdesk Assistent</h1>
      <i class="ti ti-refresh dc-refresh" aria-hidden="true" onclick="location.reload()"></i>
    </div>
    <div id="status" class="dc-status">
      <div class="spinner" aria-hidden="true"></div>
      <div class="hint">Even geduld, de helpdesk wordt geladen…</div>
    </div>
    <div id="webchat" role="main" style="display:none"></div>
  </div>

  <script>
    /* Jouw nieuwe Azure Function URL */
    var AZURE_FUNCTION_ENDPOINT = "https://func-dck-helpdesk-b8cpg3gmd6d5hsgp.westeurope-01.azurewebsites.net/api/get-chat-token";

    function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    var styleOptions = {
      backgroundColor: "#FFFFFF",
      bubbleBackground: getCss("--dc-bubble-bot"),
      bubbleTextColor: getCss("--dc-text"),
      bubbleBorderRadius: 14,
      bubbleBorderColor: "transparent",
      bubbleFromUserBackground: getCss("--dc-bubble-user"),
      bubbleFromUserTextColor: getCss("--dc-bubble-user-tx"),
      bubbleFromUserBorderRadius: 14,
      bubbleFromUserBorderColor: "transparent",
      sendBoxBackground: "#FFFFFF",
      sendBoxBorderTop: "solid 1px " + getCss("--dc-border"),
      sendBoxButtonColor: getCss("--dc-blue"),
      sendBoxHeight: 48,
      accent: getCss("--dc-blue"),
      botAvatarBackgroundColor: getCss("--dc-blue"),
      botAvatarInitials: "AI",
      userAvatarBackgroundColor: getCss("--dc-blue"),
      userAvatarInitials: "Ik",
      avatarSize: 32,
      primaryFont: getCss("--dc-font"),
      groupTimestamp: 60000,
      timestampColor: getCss("--dc-text-soft")
    };

    function showError(message){
      var status = document.getElementById("status");
      status.innerHTML = '<div class="hint" style="color:#B23B3B"><strong>De chat kon niet worden geladen.</strong><br>' + message + "</div>";
    }

    /* --- Hoofdflow: Token halen via Azure Function --- */
    (async function main() {
      try {
        // We pakken de parameters die AFAS in de URL heeft gezet (zoals publickey, code, dataurl)
        // en sturen deze 1-op-1 door naar jouw backend in Azure.
        var queryString = window.location.search;
        var fetchUrl = AZURE_FUNCTION_ENDPOINT + queryString;

        var tokenResponse = await fetch(fetchUrl).then(function (res) {
          if (!res.ok) throw new Error("Fout bij ophalen token (status " + res.status + "). Controleer de Azure Function.");
          return res.json();
        });

        // Zodra we het token hebben, starten we de chat
        var token = tokenResponse.token;
        var directLine = WebChat.createDirectLine({ token: token });

        // Verberg de lader, toon de chat
        document.getElementById("status").style.display = "none";
        var webchatEl = document.getElementById("webchat");
        webchatEl.style.display = "block";

        WebChat.renderWebChat({
          directLine: directLine,
          styleOptions: styleOptions,
          locale: "nl-NL"
        }, webchatEl);
        webchatEl.focus();

      } catch (err) {
        showError((err && err.message) ? err.message : "Onbekende fout bij het laden.");
        console.error(err);
      }
    })();
  </script>
</body>
</html>
