<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Helpdesk</title>

  <!-- Bot Framework Web Chat -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <!-- Microsoft Authentication Library (MSAL v1 — past bij Web-platform + implicit grant) -->
  <script src="https://alcdn.msftauth.net/lib/1.4.18/js/msal.min.js"></script>

  <script>
    /* =========================================================================
       SSO-CONFIGURATIE — al ingevuld op basis van jouw app registrations
       -------------------------------------------------------------------------
       CANVAS_CLIENT_ID  = Application (client) ID van "ICT Helpdesk Canvas"
       TENANT_ID         = Directory (tenant) ID
       Beide komen van de Overzicht-pagina van de CANVAS-app.
       ========================================================================= */
    var CANVAS_CLIENT_ID = "60071d66-e257-47c5-a5eb-6600eade23d1";
    var TENANT_ID        = "0ceb8564-e296-4331-9dce-d837ea00eab8";

    var clientApplication;
    (function () {
      var msalConfig = {
        auth: {
          clientId: CANVAS_CLIENT_ID,
          authority: "https://login.microsoftonline.com/" + TENANT_ID
        },
        cache: {
          cacheLocation: "localStorage",
          storeAuthStateInCookie: false
        }
      };
      if (!clientApplication) {
        clientApplication = new Msal.UserAgentApplication(msalConfig);
      }
    })();
  </script>

  <style>
    :root {
      --dc-primary:        #26215C;
      --dc-primary-soft:   #534AB7;
      --dc-bubble-bot:     #F1F0FA;
      --dc-bubble-user:    #534AB7;
      --dc-bubble-user-tx: #FFFFFF;
      --dc-bg:             #FFFFFF;
      --dc-text:           #1F2430;
      --dc-text-soft:      #5A6072;
      --dc-border:         #E4E3F0;
      --dc-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }
    html, body { margin:0; padding:0; height:100%; background:var(--dc-bg); font-family:var(--dc-font); color:var(--dc-text); }
    #app { display:flex; flex-direction:column; height:100vh; min-height:100%; }
    .dc-header { display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--dc-primary); color:#fff; flex:0 0 auto; }
    .dc-header .dc-dot { width:10px; height:10px; border-radius:50%; background:#4DA3FF; box-shadow:0 0 0 3px rgba(77,163,255,.25); }
    .dc-header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.2px; }
    .dc-header .dc-sub { font-size:12px; opacity:.8; margin-left:auto; }
    #webchat { flex:1 1 auto; min-height:0; overflow:hidden; }
    .dc-status { flex:1 1 auto; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:24px; text-align:center; color:var(--dc-text-soft); }
    .dc-status .spinner { width:28px; height:28px; border:3px solid var(--dc-border); border-top-color:var(--dc-primary-soft); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .dc-status .hint { font-size:13px; max-width:360px; line-height:1.5; }
    @media (prefers-reduced-motion: reduce) { .dc-status .spinner { animation:none; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="dc-header">
      <span class="dc-dot" aria-hidden="true"></span>
      <h1>ICT Helpdesk</h1>
      <span class="dc-sub">DC Klinieken</span>
    </div>
    <div id="status" class="dc-status">
      <div class="spinner" aria-hidden="true"></div>
      <div class="hint">Even geduld, de helpdesk wordt geladen…</div>
    </div>
    <div id="webchat" role="main" style="display:none"></div>
  </div>

  <script>
    /* Jouw token-endpoint (werkt al, ongewijzigd) */
    var TOKEN_ENDPOINT = "https://default0ceb8564e29643319dced837ea00ea.b8.environment.api.powerplatform.com/powervirtualagents/botsbyschema/cr408_ICTHelpdeskAgentv11/directline/token?api-version=2022-03-01-preview";

    function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    var styleOptions = {
      backgroundColor: "#FFFFFF",
      bubbleBackground: getCss("--dc-bubble-bot"),
      bubbleTextColor: getCss("--dc-text"),
      bubbleBorderRadius: 12,
      bubbleBorderColor: "transparent",
      bubbleFromUserBackground: getCss("--dc-bubble-user"),
      bubbleFromUserTextColor: getCss("--dc-bubble-user-tx"),
      bubbleFromUserBorderRadius: 12,
      bubbleFromUserBorderColor: "transparent",
      sendBoxBackground: "#FFFFFF",
      sendBoxBorderTop: "solid 1px " + getCss("--dc-border"),
      sendBoxButtonColor: getCss("--dc-primary-soft"),
      sendBoxHeight: 48,
      accent: getCss("--dc-primary-soft"),
      botAvatarBackgroundColor: getCss("--dc-primary"),
      botAvatarInitials: "IT",
      userAvatarBackgroundColor: getCss("--dc-primary-soft"),
      userAvatarInitials: "Ik",
      avatarSize: 32,
      primaryFont: getCss("--dc-font"),
      groupTimestamp: 60000,
      timestampColor: getCss("--dc-text-soft")
    };

    function showError(message){
      var status = document.getElementById("status");
      status.innerHTML = '<div class="hint" style="color:#B23B3B"><strong>De chat kon niet worden geladen.</strong><br>' + message + "</div>";
    }

    /* --- SSO-kern: vang de aanmeldkaart van Copilot op en wissel stil een token uit --- */

    function getOAuthCardResourceUri(activity) {
      if (activity &&
          activity.attachments &&
          activity.attachments[0] &&
          activity.attachments[0].contentType === "application/vnd.microsoft.card.oauth" &&
          activity.attachments[0].content.tokenExchangeResource) {
        return activity.attachments[0].content.tokenExchangeResource.uri;
      }
    }

    function exchangeTokenAsync(resourceUri) {
      var user = clientApplication.getAccount();
      if (user) {
        var requestObj = { scopes: [resourceUri] };
        return clientApplication.acquireTokenSilent(requestObj)
          .then(function (tokenResponse) { return tokenResponse.accessToken; })
          .catch(function (error) { console.log("Silent token-uitwisseling mislukt:", error); return null; });
      } else {
        return Promise.resolve(null);
      }
    }

    /* --- Hoofdflow --- */
    (async function main() {
      try {
        // 1) Zorg dat de gebruiker een MSAL-sessie heeft. Omdat de gebruiker al bij
        //    Entra is ingelogd in de browser, verloopt dit doorgaans onzichtbaar.
        clientApplication.handleRedirectCallback(function (error) {
          if (error) { console.log("Redirect-aanmelding fout:", error); }
        });

        if (!clientApplication.getAccount()) {
          // Geen sessie -> start een (meestal onzichtbare) aanmelding via redirect.
          // De gebruiker is al ingelogd, dus dit keert vrijwel direct terug.
          clientApplication.loginRedirect({ scopes: ["openid", "profile"] });
          return; // pagina herlaadt na de redirect; main() draait dan opnieuw
        }

        // 2) Haal een Direct Line-token op (zoals in de werkende versie)
        var token = await fetch(TOKEN_ENDPOINT).then(function (res) {
          if (!res.ok) throw new Error("Token niet verkregen (status " + res.status + ").");
          return res.json();
        }).then(function (json) { return json.token; });

        var directLine = WebChat.createDirectLine({ token: token });

        // 3) Unieke gebruikers-id (max 64 tekens), afgeleid van het Entra-account
        var acct = clientApplication.getAccount();
        var userId = (acct && acct.accountIdentifier)
          ? ("dckhelpdesk" + acct.accountIdentifier).substr(0, 64)
          : (Math.random().toString() + Date.now().toString()).substr(0, 64);

        // 4) Web Chat-store met middleware die de aanmeldkaart onderschept
        var store = WebChat.createStore({}, function (_ref) {
          var dispatch = _ref.dispatch;
          return function (next) {
            return function (action) {
              if (action.type === "DIRECT_LINE/INCOMING_ACTIVITY") {
                var activity = action.payload.activity;
                var resourceUri;
                if (activity.from && activity.from.role === "bot" &&
                    (resourceUri = getOAuthCardResourceUri(activity))) {
                  exchangeTokenAsync(resourceUri).then(function (exchangedToken) {
                    if (exchangedToken) {
                      var content = activity.attachments[0].content;
                      directLine.postActivity({
                        type: "invoke",
                        name: "signin/tokenExchange",
                        value: {
                          id: content.tokenExchangeResource.id,
                          connectionName: content.connectionName,
                          token: exchangedToken
                        },
                        from: { id: userId, name: (acct ? acct.name : "user"), role: "user" }
                      }).subscribe(
                        function (id) {
                          if (id === "retry") {
                            // Uitwisseling geweigerd -> toon alsnog de aanmeldkaart
                            next(action);
                          }
                          // bij succes: kaart wordt ingeslikt, gebruiker merkt niets
                        },
                        function (error) {
                          // Fout bij posten -> toon de kaart als terugval
                          next(action);
                        }
                      );
                      return;
                    } else {
                      return next(action);
                    }
                  });
                  return; // wacht op de async-afhandeling hierboven
                } else {
                  return next(action);
                }
              } else {
                return next(action);
              }
            };
          };
        });

        // 5) Render
        document.getElementById("status").style.display = "none";
        var webchatEl = document.getElementById("webchat");
        webchatEl.style.display = "block";
        WebChat.renderWebChat({
          directLine: directLine,
          store: store,
          styleOptions: styleOptions,
          locale: "nl-NL"
        }, webchatEl);
        webchatEl.focus();

      } catch (err) {
        showError((err && err.message) ? err.message : "Onbekende fout.");
        console.error(err);
      }
    })();
  </script>
</body>
</html>
