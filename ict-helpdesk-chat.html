<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Helpdesk</title>

  <!-- Bot Framework Web Chat (officiële Microsoft CDN) -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <style>
    :root {
      /* DC-huisstijl — pas deze waarden aan op jullie exacte merkkleuren */
      --dc-primary:        #26215C;  /* diep indigo - koppen/accent */
      --dc-primary-soft:   #534AB7;  /* helderder indigo - bot-accent */
      --dc-bubble-bot:     #F1F0FA;  /* lichte ballon - bot */
      --dc-bubble-user:    #534AB7;  /* gevulde ballon - gebruiker */
      --dc-bubble-user-tx: #FFFFFF;
      --dc-bg:             #FFFFFF;
      --dc-text:           #1F2430;
      --dc-text-soft:      #5A6072;
      --dc-border:         #E4E3F0;
      --dc-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--dc-bg);
      font-family: var(--dc-font);
      color: var(--dc-text);
    }

    /* Volledig vlak vullen — geschikt om in een InSite-iframe te hangen */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 100%;
    }

    /* Kop boven de chat */
    .dc-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--dc-primary);
      color: #fff;
      flex: 0 0 auto;
    }
    .dc-header .dc-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4DA3FF;            /* online-indicator (blauw) */
      box-shadow: 0 0 0 3px rgba(77,163,255,.25);
    }
    .dc-header h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: .2px;
    }
    .dc-header .dc-sub {
      font-size: 12px;
      opacity: .8;
      margin-left: auto;
    }

    /* Web Chat vult de rest */
    #webchat {
      flex: 1 1 auto;
      min-height: 0;            /* belangrijk: laat het chatvenster scrollen i.p.v. de pagina */
      overflow: hidden;
    }

    /* Statusmelding (laden / fout) */
    .dc-status {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: var(--dc-text-soft);
    }
    .dc-status .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--dc-border);
      border-top-color: var(--dc-primary-soft);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dc-status .hint {
      font-size: 13px;
      max-width: 360px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .dc-status .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="dc-header">
      <span class="dc-dot" aria-hidden="true"></span>
      <h1>ICT Helpdesk</h1>
      <span class="dc-sub">DC Klinieken</span>
    </div>

    <!-- Statusvlak (zichtbaar tot de chat geladen is) -->
    <div id="status" class="dc-status">
      <div class="spinner" aria-hidden="true"></div>
      <div class="hint">Even geduld, de helpdesk wordt geladen…</div>
    </div>

    <!-- Hier rendert de chat -->
    <div id="webchat" role="main" style="display:none"></div>
  </div>

  <script>
    /* =========================================================================
       INSTELLEN — VUL HIER JOUW TOKEN-ENDPOINT IN
       -------------------------------------------------------------------------
       Dit is de "Verbindingsreeks" uit Copilot Studio:
       Kanalen  ->  Web-app  ->  veld "Verbindingsreeks"  ->  knop "Kopiëren".
       Het is een volledige URL die eindigt op  ?api-version=2022-03-01-preview
       Plak hem hieronder tussen de aanhalingstekens.
       ========================================================================= */
    const TOKEN_ENDPOINT = "https://default0ceb8564e29643319dced837ea00ea.b8.environment.api.powerplatform.com/powervirtualagents/botsbyschema/cr408_ICTHelpdeskAgentv11/directline/token?api-version=2022-03-01-preview";

    /* Styling van de chatballonnen, knoppen, invoerveld — DC-huisstijl */
    const styleOptions = {
      backgroundColor: "#FFFFFF",

      // Bot-ballon
      bubbleBackground: getCss("--dc-bubble-bot"),
      bubbleTextColor: getCss("--dc-text"),
      bubbleBorderRadius: 12,
      bubbleBorderColor: "transparent",

      // Gebruiker-ballon
      bubbleFromUserBackground: getCss("--dc-bubble-user"),
      bubbleFromUserTextColor: getCss("--dc-bubble-user-tx"),
      bubbleFromUserBorderRadius: 12,
      bubbleFromUserBorderColor: "transparent",

      // Invoerbalk
      sendBoxBackground: "#FFFFFF",
      sendBoxBorderTop: "solid 1px " + getCss("--dc-border"),
      sendBoxButtonColor: getCss("--dc-primary-soft"),
      sendBoxHeight: 48,

      // Accent / avatar
      accent: getCss("--dc-primary-soft"),
      botAvatarBackgroundColor: getCss("--dc-primary"),
      botAvatarInitials: "IT",
      userAvatarBackgroundColor: getCss("--dc-primary-soft"),
      userAvatarInitials: "Ik",
      avatarSize: 32,

      // Typografie
      primaryFont: getCss("--dc-font"),
      fontSizeSmall: "80%",

      // Tijdstempels rustig houden
      groupTimestamp: 60000,
      timestampColor: getCss("--dc-text-soft")
    };

    function getCss(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function showError(message) {
      const status = document.getElementById("status");
      status.innerHTML =
        '<div class="hint" style="color:#B23B3B"><strong>De chat kon niet worden geladen.</strong><br>' +
        message + "</div>";
    }

    async function start() {
      if (TOKEN_ENDPOINT.indexOf("PLAK_HIER") !== -1) {
        showError("Er is nog geen verbindingsreeks ingevuld. Open dit bestand en vul bij TOKEN_ENDPOINT de waarde in uit Copilot Studio → Kanalen → Web-app.");
        return;
      }

      try {
        const tokenEndpointURL = new URL(TOKEN_ENDPOINT);

        // Haal een Direct Line-token op bij de agent
        const token = await fetch(tokenEndpointURL)
          .then(function (res) {
            if (!res.ok) throw new Error("Token niet verkregen (status " + res.status + "). Controleer de verbindingsreeks.");
            return res.json();
          })
          .then(function (json) {
            return json.token;
          });

        // Maak de Direct Line-verbinding met het token
        const directLine = WebChat.createDirectLine({ token: token });

        // Render de chat
        document.getElementById("status").style.display = "none";
        const webchatEl = document.getElementById("webchat");
        webchatEl.style.display = "block";

        WebChat.renderWebChat(
          {
            directLine: directLine,
            styleOptions: styleOptions,
            locale: "nl-NL"
          },
          webchatEl
        );

        webchatEl.focus();
      } catch (err) {
        showError((err && err.message) ? err.message : "Onbekende fout.");
        console.error(err);
      }
    }

    start();
  </script>
</body>
</html>
